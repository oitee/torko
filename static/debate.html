<title>Debate — Lok Sabha</title>
<style>
  :root {
    --page-plane:     #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --series-1:       #2a78d6;
    --border:         rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-plane:     #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --series-1:       #3987e5;
      --border:         rgba(255,255,255,0.10);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }
  .nav { font-size: 13px; margin-bottom: 20px; }
  .nav a { color: var(--series-1); text-decoration: none; }
  .nav a:hover { text-decoration: underline; }

  .debate-header {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .debate-title { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
  .debate-meta { color: var(--text-secondary); font-size: 13px; margin-bottom: 12px; }
  .source-link { color: var(--series-1); text-decoration: none; }
  .source-link:hover { text-decoration: underline; }
  .speaker-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(42,120,214,0.10);
    color: var(--series-1);
    border: 1px solid rgba(42,120,214,0.25);
  }
  @media (prefers-color-scheme: dark) {
    .chip { background: rgba(57,135,229,0.14); color: #79b5f0; border-color: rgba(57,135,229,0.30); }
  }

  .error { color: #d03b3b; font-size: 14px; margin-bottom: 18px; }
  .section-title { font-size: 14px; font-weight: 600; margin: 0 0 12px; }

  .transcript-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin: 0 0 12px;
    font-size: 13px;
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 10px 0;
    background: var(--page-plane);
    border-bottom: 1px solid var(--border);
  }
  .transcript-controls label { color: var(--text-secondary); }
  .transcript-controls select {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: 13px;
    max-width: 320px;
  }
  .transcript-controls .clear {
    all: unset;
    cursor: pointer;
    color: var(--series-1);
    font-size: 12px;
  }
  .transcript-controls .clear:hover { text-decoration: underline; }
  .transcript-item.dim { display: none; }

  .to-top {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--series-1);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
    display: none;
    z-index: 20;
  }
  .to-top.show { display: block; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1;
    padding: 2px 6px 2px 4px;
    border-radius: 999px;
    vertical-align: middle;
    margin-left: 6px;
    cursor: help;
    white-space: nowrap;
  }
  .badge svg { width: 11px; height: 11px; display: block; }
  .badge.verified {
    color: #1a7f4b;
    background: rgba(26,127,75,0.12);
    border: 1px solid rgba(26,127,75,0.25);
  }
  .badge.unverified {
    color: var(--text-muted);
    background: rgba(137,135,129,0.10);
    border: 1px solid rgba(137,135,129,0.28);
  }
  @media (prefers-color-scheme: dark) {
    .badge.verified { color: #57d493; background: rgba(87,212,147,0.14); border-color: rgba(87,212,147,0.30); }
  }

  .transcript-list { display: flex; flex-direction: column; gap: 10px; }
  .transcript-item {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .transcript-speaker {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .transcript-party { color: var(--text-muted); font-weight: 400; font-size: 12px; }
  .speaker-link { color: var(--series-1); text-decoration: none; }
  .speaker-link:hover { text-decoration: underline; }
  a.chip.chip-link { text-decoration: none; cursor: pointer; }
  a.chip.chip-link:hover { text-decoration: underline; }
  .transcript-index { color: var(--text-muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .transcript-text {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text-secondary);
    white-space: pre-wrap;
  }

  .mp-diff {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .mp-diff-group { margin-bottom: 14px; }
  .mp-diff-group:last-child { margin-bottom: 0; }
  .mp-diff-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 0 0 6px;
  }
  .mp-diff-summary {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    margin-bottom: 6px;
    list-style-position: inside;
  }
  .mp-diff-summary:hover { color: var(--text-primary); }
  .present-details { margin-top: 10px; }
  .present-details .speaker-chips { margin-top: 8px; }
  .mp-diff-note {
    font-size: 11.5px;
    color: var(--text-muted);
    margin: 2px 0 8px;
  }
  .chip.chip-added {
    background: rgba(26,127,75,0.12);
    color: #1a7f4b;
    border-color: rgba(26,127,75,0.25);
  }
  .chip.chip-miss {
    background: rgba(208,59,59,0.10);
    color: #b23030;
    border-color: rgba(208,59,59,0.25);
  }
  .chip.chip-ceiling {
    background: rgba(137,135,129,0.10);
    color: var(--text-muted);
    border-color: rgba(137,135,129,0.28);
  }
  .chip-reason { font-size: 10px; opacity: 0.85; }
  @media (prefers-color-scheme: dark) {
    .chip.chip-added { background: rgba(87,212,147,0.14); color: #57d493; border-color: rgba(87,212,147,0.30); }
    .chip.chip-miss { background: rgba(224,90,90,0.14); color: #e06a6a; border-color: rgba(224,90,90,0.30); }
    .chip.chip-ceiling { background: rgba(137,135,129,0.14); color: var(--text-muted); border-color: rgba(137,135,129,0.30); }
  }
</style>

<div class="wrap">
  <div class="nav"><a href="dashboard.html">&larr; Debate list</a> &nbsp;·&nbsp; <a href="speaker.html">Speaker view</a></div>
  <div id="error" class="error" style="display:none"></div>
  <div id="content"></div>
</div>
<button type="button" class="to-top" id="to-top" title="Back to top" aria-label="Back to top">&uarr;</button>

<script>
const errorEl = document.getElementById('error');
const contentEl = document.getElementById('content');

const params = new URLSearchParams(window.location.search);
const debateId = params.get('id');

async function load() {
  if (!debateId) {
    errorEl.textContent = 'No debate id given (expected ?id=18-5-4012 in the URL).';
    errorEl.style.display = 'block';
    return;
  }
  try {
    const resp = await fetch(`/api/dashboard/debates/${encodeURIComponent(debateId)}`);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Request failed');
    render(data);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    return;
  }

  try {
    const diffResp = await fetch(`/api/dashboard/debates/${encodeURIComponent(debateId)}/mp-diff`);
    const diff = await diffResp.json();
    if (diffResp.ok) renderMpDiff(diff);
  } catch (err) {
    // Non-fatal: the transcript above is the primary content, the panel is a bonus.
  }
}

const REASON_LABEL = {
  not_printed: 'never printed as a speaker (source-side gap)',
  role_only: 'present only as the Chair / a crowd label',
  fold_collision: 'name folds onto another tagged MP — dropped, never guessed',
  unexplained: 'printed as a speaker, not attributed — a real miss',
};

// A chip links to the MP's page only when `link` is true -- i.e. we attributed
// them a turn somewhere, so the page has content. Tagged-but-unattributed MPs
// get no link: we have no turn for them, and a link would imply a profile we
// may not have (same rule as the transcript names).
function mpChip(m, cls, inner, link) {
  const label = inner || escapeHtml(m.name || m.sansadId);
  if (link && m.sansadId) {
    return `<a class="chip ${cls} chip-link" href="speaker.html?id=${encodeURIComponent(m.sansadId)}">${label}</a>`;
  }
  return `<span class="chip ${cls}">${label}</span>`;
}

function renderMpDiff(diff) {
  if (!diff.taggedCount && !diff.attributedCount) return;

  const box = document.createElement('div');
  box.className = 'mp-diff';

  const groups = [];

  // Diffs first, expanded -- this is what the panel is for.
  groups.push(`
    <div class="mp-diff-group">
      <p class="mp-diff-label">Attributed by us, not in Sansad's tag list (${diff.attributedNotTagged.length})</p>
      <p class="mp-diff-note">The transcript prints these MPs as speakers; Sansad's own participant list omits them. Matched from the printed name — this panel counts names matched, not matches independently confirmed correct.</p>
      <div class="speaker-chips">
        ${diff.attributedNotTagged.map(m => mpChip(m, 'chip-added', null, true)).join('') || '<span class="mp-diff-note">none</span>'}
      </div>
    </div>
  `);

  groups.push(`
    <div class="mp-diff-group">
      <p class="mp-diff-label">Tagged by Sansad, no turn attributed (${diff.taggedNotAttributed.length})</p>
      <p class="mp-diff-note">Every one counted as a miss — worst case, deliberately. The reason on each chip says why it went unattributed; it is information, not an excuse.</p>
      <div class="speaker-chips">
        ${diff.taggedNotAttributed.map(m => mpChip(m, 'chip-miss', `${escapeHtml(m.name || m.sansadId)} <span class="chip-reason">(${escapeHtml(m.reason)})</span>`, false)).join('')}
        ${!diff.taggedNotAttributed.length ? '<span class="mp-diff-note">none</span>' : ''}
      </div>
    </div>
  `);

  // Agreement is the bulk and the least interesting -- collapse it.
  groups.push(`
    <details class="mp-diff-group">
      <summary class="mp-diff-summary">Tagged by Sansad and attributed by us (${diff.agreement.length})</summary>
      <div class="speaker-chips">
        ${diff.agreement.map(m => mpChip(m, '', null, true)).join('') || '<span class="mp-diff-note">none</span>'}
      </div>
    </details>
  `);

  box.innerHTML = `<p class="section-title">Sansad's tag list vs. our attribution (${diff.taggedCount} tagged, this debate only)</p>${groups.join('')}`;
  contentEl.insertBefore(box, contentEl.children[1] || null);
}

function render(data) {
  const header = document.createElement('div');
  header.className = 'debate-header';
  header.innerHTML = `
    <p class="debate-title">${escapeHtml(cleanTitle(data.title))}</p>
    <p class="debate-meta">LS${data.loksabha} · Session ${data.session} · dbSlno ${data.dbslno} · ${data.debateDate || 'undated'} · ${escapeHtml(data.debateType || '')} · ${data.turnCount} turns</p>
    ${data.sourceUrl ? `<p class="debate-meta"><a class="source-link" href="${escapeHtml(data.sourceUrl)}" target="_blank" rel="noopener noreferrer">View original on sansad.in ↗</a></p>` : ''}
    <details class="present-details">
      <summary class="mp-diff-summary">Speakers we attributed (${data.speakersPresent.length})</summary>
      <div class="speaker-chips">
        ${data.speakersPresent.map(s => s.sansadId
          ? `<a class="chip chip-link" href="speaker.html?id=${encodeURIComponent(s.sansadId)}">${escapeHtml(s.name)}${s.party ? ' · ' + escapeHtml(s.party) : ''}</a>`
          : `<span class="chip">${escapeHtml(s.name)}${s.party ? ' · ' + escapeHtml(s.party) : ''}</span>`).join('')}
      </div>
    </details>
  `;
  contentEl.appendChild(header);

  const sectionTitle = document.createElement('p');
  sectionTitle.className = 'section-title';
  sectionTitle.id = 'transcript-title';
  contentEl.appendChild(sectionTitle);

  contentEl.appendChild(buildTranscriptControls(data.turns));

  const list = document.createElement('div');
  list.className = 'transcript-list';
  list.id = 'transcript-list';
  contentEl.appendChild(list);

  allTurns = data.turns;
  // A speaker deep-link (?speaker=<sansadId>, e.g. from the speaker page) opens
  // the debate pre-filtered to just that person's turns.
  const wantSpeaker = params.get('speaker');
  applyTurnFilter(wantSpeaker ? `id:${wantSpeaker}` : '');
}

let allTurns = [];

// A turn's filter key: its sansadId if resolved, else its printed label. Lets
// one control cover both verified people and unresolved/role labels without
// pretending an unresolved label is an identity.
function turnKey(t) {
  return (t.verified && t.sansadId) ? `id:${t.sansadId}` : `name:${t.name || '(unattributed)'}`;
}

function buildTranscriptControls(turns) {
  const bar = document.createElement('div');
  bar.className = 'transcript-controls';

  const counts = new Map();   // key -> {label, count}
  turns.forEach(t => {
    const key = turnKey(t);
    const entry = counts.get(key) || { label: t.name || '(unattributed)', count: 0 };
    entry.count += 1;
    counts.set(key, entry);
  });
  const options = [...counts.entries()].sort((a, b) => b[1].count - a[1].count);

  bar.innerHTML = `
    <label for="turn-filter">Show turns by</label>
    <select id="turn-filter">
      <option value="">Everyone (${turns.length} turns)</option>
      ${options.map(([key, e]) => `<option value="${escapeHtml(key)}">${escapeHtml(e.label)} (${e.count})</option>`).join('')}
    </select>
    <button type="button" class="clear" id="turn-clear" style="display:none">Show all turns</button>
  `;
  bar.querySelector('#turn-filter').addEventListener('change', e => applyTurnFilter(e.target.value));
  bar.querySelector('#turn-clear').addEventListener('click', () => applyTurnFilter(''));
  return bar;
}

function applyTurnFilter(key) {
  const sel = document.getElementById('turn-filter');
  const clearBtn = document.getElementById('turn-clear');
  const list = document.getElementById('transcript-list');
  const title = document.getElementById('transcript-title');
  if (sel && sel.value !== key) sel.value = key;

  // Render every turn once, keeping its ORIGINAL #index; the filter hides the
  // rest so numbering still refers to position in the full debate.
  const shown = [];
  list.innerHTML = allTurns.map((t, i) => {
    const match = !key || turnKey(t) === key;
    if (match) shown.push(i);
    const name = t.name || '(unattributed)';
    const nameHtml = (t.verified && t.sansadId)
      ? `<a class="speaker-link" href="speaker.html?id=${encodeURIComponent(t.sansadId)}">${escapeHtml(name)}</a>`
      : escapeHtml(name);
    return `
      <div class="transcript-item${match ? '' : ' dim'}">
        <div class="transcript-speaker">
          ${nameHtml}${t.party ? `<span class="transcript-party"> · ${escapeHtml(t.party)}</span>` : ''}${badge(t.verified, t.nameSource)}<span class="transcript-index">#${i + 1}</span>
        </div>
        <div class="transcript-text">${escapeHtml(t.text)}</div>
      </div>`;
  }).join('');

  if (key) {
    const label = (sel && sel.selectedOptions[0]) ? sel.selectedOptions[0].textContent : '';
    title.textContent = `Transcript — ${shown.length} of ${allTurns.length} turns (${label})`;
    if (clearBtn) clearBtn.style.display = '';
  } else {
    title.textContent = `Transcript (${allTurns.length} turns, in order)`;
    if (clearBtn) clearBtn.style.display = 'none';
  }
}

function badge(verified, source) {
  if (verified) {
    return `<span class="badge verified" title="Normalised to official MP list (${escapeHtml(source || 'anchor')})">`
      + `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>Verified</span>`;
  }
  return `<span class="badge unverified" title="Raw transcript label — not matched to the MP list">Unverified</span>`;
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Titles come straight from the source HTML: markup (`210<sup>th</sup>`),
// entities (`&amp;`), stray `\r\n`. Strip tags, decode entities via a detached
// textarea (text-only, executes nothing), collapse whitespace. Escape at call site.
function cleanTitle(s) {
  // Block tags become a space so words don't fuse; inline tags (<sup>, <span>,
  // <b>…) are dropped so ordinals read "194th", not "194 th".
  const spaced = (s || '').replace(/<\s*\/?(br|p)\b[^>]*>/gi, ' ');
  const noTags = spaced.replace(/<[^>]*>/g, '');
  const ta = document.createElement('textarea');
  ta.innerHTML = noTags;
  return ta.value.replace(/\s+/g, ' ').trim();
}

// Back-to-top button: appears once the reader is well down a long transcript,
// so navigating a giant debate doesn't mean a long manual scroll back.
const toTop = document.getElementById('to-top');
toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
window.addEventListener('scroll', () => {
  toTop.classList.toggle('show', window.scrollY > 600);
}, { passive: true });

load();
</script>
